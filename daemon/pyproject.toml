[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-macropad-daemon"
version = "0.1.0"
description = "Keybow 2040 macropad daemon for the GitHub Copilot app"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
copilot-macropad = "macropad_daemon.main:main"

[tool.setuptools]
packages = ["macropad_daemon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
